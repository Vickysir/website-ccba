    <script>
      const leadershipRoles = ['会长', '创始会长', '荣誉会长'];
      const councilRoles = [
        '名誉会长',
        '特邀理事',
        '监事委员会',
        '常务副会长',
        '财务部',
        '秘书长',
        '副秘书长',
        '副会长',
        '会长助理',
        '理事',
      ];
      const advisorRoles = [
        '高级顾问',
        '政务顾问',
        '商业顾问',
        '法律顾问',
        '教育顾问',
        '特邀顾问',
      ];

      function membersForRole(role) {
        return membershipData.filter((member) => member.job === role);
      }

      function createMemberCard(member, role) {
        const card = document.createElement('div');
        card.className = 'member-card';

        const name = document.createElement('span');
        name.className = 'member-name';
        name.textContent = member.name;
        card.appendChild(name);

        if (advisorRoles.includes(role)) {
          const label = document.createElement('span');
          label.className = 'advisor-role';
          label.textContent = role;
          card.appendChild(label);
        }

        return card;
      }

      function createMemberSection(role, members, isAdvisor) {
        const section = document.createElement('section');
        section.className = 'membership-section';

        const heading = document.createElement('div');
        heading.className = 'membership-section-heading';

        const title = document.createElement('h2');
        title.textContent = isAdvisor ? '商会顾问' : role;
        heading.appendChild(title);

        const count = document.createElement('span');
        count.className = 'membership-count';
        count.textContent = members.length;
        heading.appendChild(count);
        section.appendChild(heading);

        const grid = document.createElement('div');
        grid.className = isAdvisor
          ? 'membership-grid advisor-grid'
          : 'membership-grid';
        members.forEach((member) => grid.appendChild(createMemberCard(member, member.job)));
        section.appendChild(grid);

        return section;
      }

      function renderMembership() {
        const leadership = document.querySelector('#membership-leadership');
        leadershipRoles.forEach((role) => {
          const member = membersForRole(role)[0];
          if (!member) return;

          const card = document.createElement('article');
          card.className = 'leadership-card';

          const roleLabel = document.createElement('span');
          roleLabel.className = 'leadership-role';
          roleLabel.textContent = role;

          const name = document.createElement('strong');
          name.className = 'leadership-name';
          name.textContent = member.name;

          card.appendChild(roleLabel);
          card.appendChild(name);
          leadership.appendChild(card);
        });

        const groups = document.querySelector('#membership-groups');
        councilRoles.forEach((role) => {
          const members = membersForRole(role);
          if (members.length) groups.appendChild(createMemberSection(role, members, false));
        });

        const advisors = advisorRoles.flatMap((role) => membersForRole(role));
        document
          .querySelector('#membership-advisor-section')
          .replaceWith(createMemberSection('商会顾问', advisors, true));
      }

      renderMembership();
    </script>
